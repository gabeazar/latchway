name: go

on:
  push:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "web/**"
      - "relay/test/**"
      - "testdata/**"
      - "Dockerfile"
      - ".github/workflows/go.yml"
      - ".github/actions/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Build, vet, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: go build ./... 2>&1 | tee build.log

      - name: Vet
        run: go vet ./... 2>&1 | tee vet.log

      - name: Unit tests
        run: |
          set -o pipefail
          go test -race -count=1 ./... 2>&1 | tee test.log

      - name: Behaviour tests against the Go rendezvous
        run: |
          set -o pipefail
          go run ./cmd/latchway-rendezvous --listen 127.0.0.1:8787 > rz.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/healthz >/dev/null 2>&1 && break; sleep 1; done
          RELAY_URL=http://127.0.0.1:8787 node --test relay/test/*.test.mjs 2>&1 | tee behaviour.log

      - name: Report failure
        if: failure()
        uses: ./.github/actions/report-log
        with:
          title: go checks failed
          files: build.log vet.log test.log behaviour.log rz.log

  image:
    name: Publish rendezvous image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/latchway-rendezvous:latest
            ghcr.io/${{ github.repository_owner }}/latchway-rendezvous:${{ github.sha }}
