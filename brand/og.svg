<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Latchway: send a big file from your phone straight to theirs">
  <!--
    Social preview card (1200x630). Rendered to web/og.png by render.mjs.
    Text uses Segoe UI when rendering; the PNG is what ships, so the font
    only needs to exist on the machine that renders it.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24334A"/>
      <stop offset="1" stop-color="#16212E"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#F7F8F6"/>

  <!-- the icon tile -->
  <g transform="translate(96 143)">
    <rect width="240" height="240" rx="52" fill="url(#tile)"/>
    <g transform="translate(45 45) scale(2.34375)">
      <rect x="6" y="9" width="8" height="46" rx="4" fill="#F7F8F6"/>
      <rect x="50" y="9" width="8" height="46" rx="4" fill="#F7F8F6"/>
      <path d="M40 23.5h11.5a3.5 3.5 0 0 1 3.5 3.5v10a3.5 3.5 0 0 1-3.5 3.5H40" fill="none" stroke="#F7F8F6" stroke-width="4" stroke-linecap="round"/>
      <rect x="12" y="27.5" width="37" height="9" rx="4.5" fill="#D2A24A"/>
      <circle cx="19" cy="32" r="2.8" fill="#16212E"/>
    </g>
  </g>

  <!-- wordmark and tagline -->
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" fill="#1D2A3A">
    <text x="396" y="222" font-size="88" font-weight="600" letter-spacing="-2">Latchway</text>
    <text x="398" y="300" font-size="38" font-weight="400">Send a big file from your phone</text>
    <text x="398" y="350" font-size="38" font-weight="400">straight to theirs.</text>
    <text x="398" y="420" font-size="26" font-weight="400" fill="#55606D">Encrypted end to end  ·  No account  ·  No cloud copy  ·  Open source</text>
  </g>

  <!-- brass rule, like the latch bar -->
  <rect x="396" y="462" width="420" height="10" rx="5" fill="#B8862B"/>
  <text x="1104" y="570" text-anchor="end" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#96691C">latchway.app</text>
</svg>
