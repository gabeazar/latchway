<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Latchway">
  <!--
    The Latchway mark: a gate latch. Two posts, a brass bar resting in its
    keeper. Closed, level, nothing fancy. Ink #1D2A3A on light backgrounds,
    paper #F7F8F6 on dark ones (see icon.svg); the bar is always brass.
  -->
  <rect x="6" y="9" width="8" height="46" rx="4" fill="#1D2A3A"/>
  <rect x="50" y="9" width="8" height="46" rx="4" fill="#1D2A3A"/>
  <path d="M40 23.5h11.5a3.5 3.5 0 0 1 3.5 3.5v10a3.5 3.5 0 0 1-3.5 3.5H40" fill="none" stroke="#1D2A3A" stroke-width="4" stroke-linecap="round"/>
  <rect x="12" y="27.5" width="37" height="9" rx="4.5" fill="#B8862B"/>
  <circle cx="19" cy="32" r="2.8" fill="#1D2A3A"/>
</svg>
